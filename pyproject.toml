[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "varden"
version = "1.0.1"
description = "Runtime security, policy enforcement, provenance and predictive authority for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Mark Griffiths" }
]
keywords = [
  "ai",
  "agents",
  "llm",
  "security",
  "agent-security",
  "runtime-security",
  "ai-security",
  "firewall",
  "mcp",
  "webmcp",
  "provenance",
  "authority",
  "policy",
  "guardrails",
  "observability",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Monitoring",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "requests>=2.31",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.1",
]
langchain = [
  "langchain>=0.2",
  "langchain-core>=0.2",
]
mcp = [
  "mcp[cli]>=1.2,<3",
  "httpx>=0.27",
]
test = [
  "pytest>=8",
  "mcp[cli]>=1.2,<3",
  "hypothesis>=6.100",
  "requests>=2.31",
  "build>=1.0",
  "playwright>=1.40",
  "pytest-playwright>=0.4",
]
all = [
  "psycopg[binary]>=3.1",
  "langchain>=0.2",
  "langchain-core>=0.2",
  "mcp[cli]>=1.2,<3",
]

[project.urls]
Homepage = "https://github.com/markndg/varden"
Documentation = "https://github.com/markndg/varden#readme"
Repository = "https://github.com/markndg/varden"
Issues = "https://github.com/markndg/varden/issues"
Security = "https://github.com/markndg/varden/security"
Changelog = "https://github.com/markndg/varden/blob/main/CHANGELOG.md"

[project.scripts]
varden = "varden.cli:main"
varden-monitor = "varden_monitor.cli:main"
varden-session = "varden_monitor.session:main"
varden-mcp = "varden_mcp.server:main"

[tool.setuptools.packages.find]
include = ["varden*", "varden_sdk*", "varden_langchain*", "varden_monitor*", "varden_mcp*", "skills*"]

[tool.setuptools.package-data]
"varden" = [
  "web/**/*",
  "policy-packs/*.json",
  "webshield/corpus/*.json",
  "provenance/corpus/*.json",
  "skills/varden-security/**/*",
]
"skills" = ["varden-security/**/*"]
